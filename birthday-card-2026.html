<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9efe8">
  <title>권사님, 생신 축하드립니다!</title>
  <style>
    :root { color-scheme: light; --ink:#49302e; --rose:#9a4b60; --cream:#f9efe8; }
    * { box-sizing:border-box; }
    html, body { width:100%; min-height:100%; margin:0; }
    body { overflow:hidden; background:var(--cream); color:var(--ink); font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; -webkit-tap-highlight-color:transparent; }
    .card { position:relative; display:grid; place-items:center; width:100%; min-height:100vh; min-height:100svh; padding:calc(36px + env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left)); overflow:hidden; isolation:isolate; cursor:pointer; touch-action:manipulation; }
    .card::before { content:""; position:absolute; inset:15px; border:1px solid rgba(154,75,96,.24); border-radius:28px; pointer-events:none; z-index:3; }
    .card::after { content:""; position:absolute; inset:27px; border:1px solid rgba(154,75,96,.10); border-radius:22px; pointer-events:none; z-index:3; }
    .wash { position:absolute; inset:0; z-index:-2; background:radial-gradient(ellipse 76% 46% at 50% 43%,#fff9f3 0%,#f8eee8 75%,#f2dfdc 100%); }
    .wash::before,.wash::after { content:""; position:absolute; width:66vmax; height:66vmax; border:1px solid rgba(160,91,101,.09); border-radius:50%; }
    .wash::before { top:-48vmax; left:-35vmax; } .wash::after { bottom:-52vmax; right:-34vmax; }
    .petal-field, #fireworks { position:absolute; inset:0; pointer-events:none; }
    .petal-field { overflow:hidden; z-index:0; }
    #fireworks { z-index:4; width:100%; height:100%; }
    .petal { position:absolute; top:-12vh; left:0; width:var(--size); height:calc(var(--size) * .76); border-radius:78% 12% 70% 12%; background:var(--tone); opacity:var(--opacity); filter:drop-shadow(0 2px 2px rgba(120,60,72,.12)); animation:fall var(--duration) linear var(--delay) infinite; will-change:transform; }
    @keyframes fall { from { transform:translate3d(var(--start),-12vh,0) rotate(0deg); } to { transform:translate3d(calc(var(--start) + var(--drift)),112vh,0) rotate(var(--spin)); } }
    .bouquet { position:absolute; width:min(53vw,330px); opacity:.47; z-index:0; pointer-events:none; }
    .bouquet.top { top:-12px; right:-40px; transform:rotate(17deg); }
    .bouquet.bottom { bottom:-17px; left:-47px; transform:rotate(198deg); }
    .center { position:relative; z-index:2; width:min(100%,710px); text-align:center; padding:62px 8px; animation:appear 1.1s ease-out both; }
    @keyframes appear { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    .ornament { display:flex; align-items:center; justify-content:center; gap:17px; margin-bottom:30px; color:var(--rose); font-family:Georgia,serif; font-size:29px; }
    .ornament::before,.ornament::after { content:""; width:clamp(32px,11vw,94px); height:1px; background:linear-gradient(90deg,transparent,#ba8792); }
    .ornament::after { transform:rotate(180deg); }
    h1 { margin:0; font-family:"Nanum Myeongjo","Batang","AppleMyungjo",serif; font-weight:700; font-size:clamp(40px,9.4vw,86px); line-height:1.36; letter-spacing:-.055em; text-wrap:balance; text-shadow:0 2px 0 rgba(255,255,255,.8); }
    h1 span { display:block; white-space:nowrap; }
    .rule { width:46px; height:2px; margin:34px auto 21px; border-radius:2px; background:#bb7886; }
    .hint { margin:0; color:#815e63; font-size:clamp(14px,3.7vw,18px); letter-spacing:.02em; }
    .hint b { font-weight:600; }
    @media (max-width:480px) { .card::before { inset:11px; border-radius:19px; } .card::after { inset:20px; border-radius:14px; } .bouquet { width:72vw; opacity:.33; } .bouquet.top { top:-18px; right:-83px; } .bouquet.bottom { bottom:-29px; left:-87px; } .center { transform:translateY(-5px); } .ornament { margin-bottom:26px; } .rule { margin-top:30px; } }
    @media (prefers-reduced-motion:reduce) { .petal { animation:none; transform:translate3d(var(--start),var(--still),0) rotate(30deg); } .center { animation:none; } }
  </style>
</head>
<body>
  <main class="card" id="card" aria-label="권사님 생신 축하 카드. 화면을 누르면 폭죽이 터집니다." tabindex="0">
    <div class="wash" aria-hidden="true"></div>
    <div class="petal-field" id="petals" aria-hidden="true"></div>
    <svg class="bouquet top" viewBox="0 0 300 310" fill="none" aria-hidden="true"><g stroke="#98606b" stroke-width="1.3" stroke-linecap="round"><path d="M218-8C188 79 125 145 57 300M198 46c-36-18-70-13-81 21 26 1 52-3 81-21Zm-38 62c44-38 84-29 95-7-25 14-56 18-95 7Zm-42 46c-32-17-66-10-77 13 23 12 50 13 77-13Zm-36 41c34-30 72-25 82-2-24 10-49 14-82 2Z"/><path d="M222 9c35-35 61 4 40 26-18 17-40 9-40-26Zm12 32c-5-34 39-45 51-16 9 21-13 39-51 16Zm-26 2c-17-31-54-12-47 14 8 27 37 20 47-14Zm-1 23c25-25 58-2 45 25-12 22-43 9-45-25Z" fill="#e7b9c0"/><circle cx="220" cy="42" r="16" fill="#b77784"/><path d="M96 91c27-26 49 2 34 19-12 16-32 11-34-19Zm10 18c-13-20-38-6-32 13 6 19 27 15 32-13Zm8 14c22-13 38 10 25 24-12 14-29 1-25-24Z" fill="#eac4ca"/><circle cx="111" cy="113" r="10" fill="#b77784"/></g></svg>
    <svg class="bouquet bottom" viewBox="0 0 300 310" fill="none" aria-hidden="true"><g stroke="#98606b" stroke-width="1.3" stroke-linecap="round"><path d="M218-8C188 79 125 145 57 300M198 46c-36-18-70-13-81 21 26 1 52-3 81-21Zm-38 62c44-38 84-29 95-7-25 14-56 18-95 7Zm-42 46c-32-17-66-10-77 13 23 12 50 13 77-13Zm-36 41c34-30 72-25 82-2-24 10-49 14-82 2Z"/><path d="M222 9c35-35 61 4 40 26-18 17-40 9-40-26Zm12 32c-5-34 39-45 51-16 9 21-13 39-51 16Zm-26 2c-17-31-54-12-47 14 8 27 37 20 47-14Zm-1 23c25-25 58-2 45 25-12 22-43 9-45-25Z" fill="#e7b9c0"/><circle cx="220" cy="42" r="16" fill="#b77784"/><path d="M96 91c27-26 49 2 34 19-12 16-32 11-34-19Zm10 18c-13-20-38-6-32 13 6 19 27 15 32-13Zm8 14c22-13 38 10 25 24-12 14-29 1-25-24Z" fill="#eac4ca"/><circle cx="111" cy="113" r="10" fill="#b77784"/></g></svg>
    <section class="center"><div class="ornament" aria-hidden="true">✿</div><h1><span>권사님,</span><span>생신 축하드립니다!</span></h1><div class="rule" aria-hidden="true"></div><p class="hint">화면을 <b>톡</b> 눌러 보세요 ✦</p></section>
    <canvas id="fireworks" aria-hidden="true"></canvas>
  </main>
  <script>
    (() => {
      const card = document.getElementById('card');
      const field = document.getElementById('petals');
      const canvas = document.getElementById('fireworks');
      const ctx = canvas.getContext('2d');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let w = 0, h = 0, particles = [], running = false;
      const palette = ['#a9576d','#d98291','#efaa8e','#f4c77b','#b787b7','#fff1d7'];
      function resize() {
        const rect = card.getBoundingClientRect();
        w = rect.width; h = rect.height;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize(); addEventListener('resize', resize, {passive:true});
      const random = (a,b) => a + Math.random() * (b-a);
      for (let i=0; i<31; i++) {
        const p=document.createElement('i');
        p.className='petal';
        p.style.setProperty('--size', random(8,19).toFixed(1)+'px');
        p.style.setProperty('--tone', ['#df9aa9','#ecb3b6','#f2c8bd','#d88da2'][i%4]);
        p.style.setProperty('--opacity', random(.43,.83).toFixed(2));
        p.style.setProperty('--start', random(0,100).toFixed(1)+'vw');
        p.style.setProperty('--drift', random(-95,95).toFixed(1)+'px');
        p.style.setProperty('--spin', random(390,920).toFixed(0)+'deg');
        p.style.setProperty('--duration', random(13,25).toFixed(1)+'s');
        p.style.setProperty('--delay', (-random(0,25)).toFixed(1)+'s');
        p.style.setProperty('--still', random(5,90).toFixed(1)+'vh');
        field.appendChild(p);
      }
      function burst(x,y) {
        const color=palette[Math.floor(random(0,palette.length))];
        const count=reduced ? 14 : 55;
        for(let i=0;i<count;i++) {
          const angle=i/count*Math.PI*2+random(-.07,.07);
          const speed=random(reduced?1.2:2.5,reduced?3.5:6.8);
          particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,fade:random(.012,.023),radius:random(1.5,3.8),color,gravity:random(.025,.08)});
        }
        if(!running){running=true;requestAnimationFrame(draw);}
      }
      function draw() {
        ctx.clearRect(0,0,w,h);
        particles=particles.filter(p => p.life>0);
        for(const p of particles){
          p.x+=p.vx; p.y+=p.vy; p.vx*=.986; p.vy=p.vy*.986+p.gravity; p.life-=p.fade;
          ctx.globalAlpha=Math.max(0,p.life);
          ctx.fillStyle=p.color;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.radius*Math.max(.35,p.life),0,Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha=1;
        if(particles.length) requestAnimationFrame(draw); else running=false;
      }
      card.addEventListener('pointerdown',event=>{const r=card.getBoundingClientRect();const x=event.clientX-r.left,y=event.clientY-r.top;burst(x,y);if(!reduced){setTimeout(()=>burst(Math.max(34,Math.min(w-34,x+random(-65,65))),Math.max(34,Math.min(h-34,y+random(-65,65)))),140);}});
      card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();burst(w/2,h/2);}});
    })();
  </script>
</body>
</html>
